<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NOVA TV</title>
<style>
:root{--bg:#06090d;--panel:#111923;--muted:#9caabd;--blue:#38baff;--white:#f4f7fb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 75% 8%,#172431 0%,transparent 40%),linear-gradient(120deg,#06080b,#030507 75%);color:var(--white);font-family:Arial,sans-serif}.app{height:100vh;display:grid;grid-template-columns:15% minmax(0,1fr);padding:2.5vh 2vw;gap:2vw}nav{display:flex;flex-direction:column;gap:.6vh;padding-top:5vh}.brand{font-size:2.3vh;font-weight:900;letter-spacing:.2em;margin:0 0 3vh 1vw}.brand b{color:var(--blue)}.nav{height:7vh;background:transparent;color:#a8b0bd;border:1px solid transparent;border-radius:1vh;text-align:left;padding:0 1vw;display:flex;align-items:center;gap:.8vw;font-size:1.7vh}.nav .icon{font-size:2.7vh;width:2.3vw;text-align:center}.nav:focus,.tile:focus,.appitem:focus,.action:focus{outline:.28vw solid var(--blue);outline-offset:2px;background:#1a2b39;color:white}.nav.active{background:#17212d;color:white;border-color:#24394a}main{min-width:0;overflow:hidden;display:flex;flex-direction:column}.top{height:5vh;display:flex;align-items:center;justify-content:flex-end;gap:1.5vw;color:#9da8b6;font-size:1.6vh}.hero{height:31vh;flex-shrink:0;border-radius:1.1vh;overflow:hidden;position:relative;margin:1.2vh 0 2vh;background:linear-gradient(90deg,#05080d 0%,rgba(5,8,13,.94) 29%,rgba(5,8,13,.2) 100%),radial-gradient(ellipse at 76% 35%,#4e5b68 0%,#1b2a38 28%,#0b1119 60%,#05070a 100%);border:1px solid #1b242e}.heroText{position:absolute;left:2.2vw;top:3.2vh;max-width:52%}.kicker{font-size:1.4vh;color:#a8dfff;letter-spacing:.24em;margin-bottom:1vh}h1{font-size:5vh;line-height:1.02;margin:0 0 1vh;font-weight:950}.desc{font-size:1.7vh;color:#c2c8d1;margin-bottom:2vh}.actions{display:flex;gap:.7vw}.action{border:1px solid #39424e;background:#151d27;color:white;border-radius:.8vh;padding:1.15vh 1.2vw;font-size:1.6vh;font-weight:700}.primary{background:#f4f6f9;color:#0b1016;border-color:white}.section{flex-shrink:0;margin-bottom:1.4vh}.sectionHead{font-size:2.2vh;font-weight:800;margin:0 0 1vh}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1vw}.tile{height:13vh;border:1px solid #1c2732;border-radius:1vh;color:#fff;background:linear-gradient(130deg,#143a51,#111b26 60%,#191e25);font-size:1.8vh;font-weight:700;text-align:left;padding:1.3vh 1vw;display:flex;align-items:flex-end;position:relative}.tile:nth-child(2){background:linear-gradient(130deg,#183b3e,#121b24 70%)}.tile:nth-child(3){background:linear-gradient(130deg,#17324e,#141a24 70%)}.tile:nth-child(4){background:linear-gradient(130deg,#57251e,#181a20 75%)}.tile:nth-child(5){background:linear-gradient(130deg,#33313b,#171b22 75%)}.tile .ico{position:absolute;right:1vw;top:1vh;font-size:3vh;color:#dce8f3;opacity:.8}.appgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.2vw;overflow-y:auto;padding:1vh .4vw 2vh}.appitem{height:15vh;border-radius:1.2vh;padding:1.5vh 1vw;font-size:1.8vh;background:linear-gradient(145deg,#182b3e,#101722);border:1px solid #2b4054}.appico{font-size:3.5vh}.appitem{min-width:0;height:9vh;background:#111923;border:1px solid #283440;border-radius:.8vh;color:white;text-align:left;padding:1vh;display:flex;flex-direction:column;justify-content:space-between;font-size:1.5vh}.appico{font-size:2.7vh}.hidden{display:none}.toast{position:absolute;bottom:2vh;right:2vw;background:#1b2734;border:1px solid #3b4d60;border-radius:1vh;padding:1vh 1.5vw;font-size:1.8vh;color:white}
</style></head><body><div class="app"><nav><div class="brand">NOVA <b>TV</b></div><button class="nav active" data-page="home"><span class="icon">⌂</span>Главная</button><button class="nav" data-page="apps"><span class="icon">▦</span>Приложения</button><button class="nav" data-page="search"><span class="icon">⌕</span>Поиск</button><button class="nav" id="settings"><span class="icon">⚙</span>Настройки</button><button class="nav" data-page="favs"><span class="icon">♡</span>Избранное</button><div style="margin-top:auto;color:#778596;font-size:1.3vh;padding:1vh 1vw">NOVA TV • FIRE</div></nav><main><div class="top"><span id="clock">--:--</span><span>● Wi-Fi</span><span>◉</span></div><section id="home"><div class="hero"><div class="heroText"><div class="kicker">NOVA ORIGINAL</div><h1>Время<br>смотреть</h1><div class="desc">Весь твой контент — на одном экране.</div><div class="actions"><button class="action primary" id="watch">▶ Смотреть</button><button class="action" id="details">Подробнее</button></div></div></div><div class="section"><div class="sectionHead">Продолжить просмотр</div><div class="cards"><button class="tile" data-title="Фильмы"><span class="ico">▶</span>Фильмы</button><button class="tile" data-title="Сериалы"><span class="ico">▣</span>Сериалы</button><button class="tile" data-title="Спорт"><span class="ico">⚽</span>Спорт</button><button class="tile" data-title="Музыка"><span class="ico">♫</span>Музыка</button><button class="tile" data-title="YouTube"><span class="ico">▶</span>YouTube</button></div></div><div class="section"><div class="sectionHead">Популярное</div><div class="cards"><button class="tile" data-title="Кино"><span class="ico">✦</span>Кино</button><button class="tile" data-title="ТВ"><span class="ico">▤</span>ТВ</button><button class="tile" data-title="Мультфильмы"><span class="ico">◈</span>Мультфильмы</button><button class="tile" data-title="Игры"><span class="ico">⌘</span>Игры</button><button class="tile" data-title="Все приложения"><span class="ico">＋</span>Все приложения</button></div></div></section><section id="apps" class="hidden"><div class="sectionHead" style="margin-top:3vh">Все приложения</div><div id="appgrid" class="appgrid"></div></section><section id="search" class="hidden"><div class="sectionHead" style="margin-top:3vh">Поиск</div><div class="desc">Выбери приложение в разделе «Приложения».</div></section><section id="favs" class="hidden"><div class="sectionHead" style="margin-top:3vh">Избранное</div><div class="desc">Добавляй нужные приложения в избранное.</div></section></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let current='home',apps=[];function toast(t){let x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}function setPage(p){current=p;document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==p));document.querySelectorAll('.nav[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='apps')loadApps();let target=document.querySelector('#'+p+' button:not(.hidden)');if(target)target.focus();else document.querySelector('.nav[data-page="'+p+'"]')?.focus()}function backHome(){setPage('home')}function loadApps(){try{apps=JSON.parse(window.NovaTV.getApps()||'[]')}catch(e){apps=[]}let grid=$('#appgrid');grid.innerHTML='';if(!apps.length){grid.innerHTML='<div class="desc">Список приложений недоступен на этой прошивке.</div>';return}apps.forEach((a,i)=>{let b=document.createElement('button');b.className='appitem';b.innerHTML='<span class="appico">'+['▣','▶','♫','◉','⌘','▤'][i%6]+'</span><span>'+esc(a.name)+'</span>';b.onclick=()=>window.NovaTV.launchApp(a.package);grid.appendChild(b)})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#settings').onclick=()=>window.NovaTV.openSettings();function launchNamed(t){if(t==='Все приложения'){setPage('apps');return}if(!apps.length)loadApps();let a=apps.find(x=>x.name.toLowerCase().includes(t.toLowerCase()));if(a)window.NovaTV.launchApp(a.package);else toast('Приложение «'+t+'» не установлено')}document.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>launchNamed(b.dataset.title));$('#watch').onclick=()=>setPage('apps');$('#details').onclick=()=>toast('NOVA TV');document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){let els=[...document.querySelectorAll('button')].filter(x=>x.offsetParent!==null&&!x.disabled),cur=document.activeElement;if(!els.includes(cur)){els[0]?.focus();e.preventDefault();return}let a=cur.getBoundingClientRect(),cx=a.left+a.width/2,cy=a.top+a.height/2;let dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]},[dx,dy]=dirs[e.key],best=null,score=Infinity;for(let el of els){if(el===cur)continue;let r=el.getBoundingClientRect(),x=r.left+r.width/2-cx,y=r.top+r.height/2-cy,forward=x*dx+y*dy;if(forward<=2)continue;let cross=Math.abs(x*dy-y*dx),s=forward+cross*2;if(s<score){score=s;best=el}}if(best)best.focus();e.preventDefault()}if(e.key==='Escape'||e.key==='Backspace'){if(current!=='home')backHome();else e.preventDefault()}});setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),10000);setTimeout(()=>document.querySelector('.nav')?.focus(),400);
</script></body></html>
